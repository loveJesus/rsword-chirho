# For God so loved the world that he gave his only begotten Son,
# that whoever believes in him should not perish but have eternal life.
# John 3:16

name: Release rsword-chirho

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_chirho:
        description: 'Version to release (e.g., 0.2.1)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build-chirho:
    name: Build ${{ matrix.os_chirho }}
    runs-on: ${{ matrix.os_chirho }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_chirho: ubuntu-latest
            target_chirho: x86_64-unknown-linux-gnu
            suffix_chirho: ''
            archive_chirho: tar.gz
          - os_chirho: macos-latest
            target_chirho: x86_64-apple-darwin
            suffix_chirho: ''
            archive_chirho: tar.gz
          - os_chirho: macos-latest
            target_chirho: aarch64-apple-darwin
            suffix_chirho: ''
            archive_chirho: tar.gz
          - os_chirho: windows-latest
            target_chirho: x86_64-pc-windows-msvc
            suffix_chirho: '.exe'
            archive_chirho: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable
        with:
          targets: ${{ matrix.target_chirho }}

      - name: Install Linux dependencies
        if: matrix.os_chirho == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target_chirho }} -p sword_tools_chirho

      - name: Prepare artifact directory
        shell: bash
        run: mkdir -p dist-chirho

      - name: Copy binaries (Unix)
        if: matrix.os_chirho != 'windows-latest'
        shell: bash
        run: |
          for bin_chirho in diatheke_chirho installmgr_chirho osis2mod_chirho tei2mod_chirho \
                            imp2vs_chirho imp2ld_chirho imp2gbs_chirho mod2imp_chirho \
                            mod2osis_chirho mod2zmod_chirho mkfastmod_chirho vpl2mod_chirho \
                            modinfo_chirho modvalidate_chirho modwizard_chirho; do
            if [ -f "target/${{ matrix.target_chirho }}/release/${bin_chirho}" ]; then
              cp "target/${{ matrix.target_chirho }}/release/${bin_chirho}" dist-chirho/
              chmod +x "dist-chirho/${bin_chirho}"
            fi
          done

      - name: Copy binaries (Windows)
        if: matrix.os_chirho == 'windows-latest'
        shell: pwsh
        run: |
          $binaries_chirho = @(
            'diatheke_chirho', 'installmgr_chirho', 'osis2mod_chirho', 'tei2mod_chirho',
            'imp2vs_chirho', 'imp2ld_chirho', 'imp2gbs_chirho', 'mod2imp_chirho',
            'mod2osis_chirho', 'mod2zmod_chirho', 'mkfastmod_chirho', 'vpl2mod_chirho',
            'modinfo_chirho', 'modvalidate_chirho', 'modwizard_chirho'
          )
          foreach ($bin_chirho in $binaries_chirho) {
            $src_chirho = "target/${{ matrix.target_chirho }}/release/${bin_chirho}.exe"
            if (Test-Path $src_chirho) {
              Copy-Item $src_chirho -Destination "dist-chirho/"
            }
          }

      - name: Create archive (Unix)
        if: matrix.os_chirho != 'windows-latest'
        shell: bash
        run: |
          cd dist-chirho
          tar -czvf ../sword-tools-chirho-${{ matrix.target_chirho }}.tar.gz *

      - name: Create archive (Windows)
        if: matrix.os_chirho == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path dist-chirho\* -DestinationPath sword-tools-chirho-${{ matrix.target_chirho }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sword-tools-chirho-${{ matrix.target_chirho }}
          path: sword-tools-chirho-${{ matrix.target_chirho }}.${{ matrix.archive_chirho }}

  release-chirho:
    name: Create Release
    needs: build-chirho
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts-chirho

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts-chirho/**/*
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
