# For God so loved the world that he gave his only begotten Son,
# that whoever believes in him should not perish but have eternal life.
# John 3:16

[package]
name = "rsword_chirho"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core SWORD module library in pure Rust"
readme = "README.md"
keywords = ["bible", "sword", "scripture", "module"]
categories = ["text-processing"]

[features]
# Default enables native platform support with all features
default = ["native"]

# Native platform support (std::fs, tantivy, walkdir, memmap, etc.)
native = ["tantivy", "walkdir", "memmap2", "tar", "ureq"]

# WASM support (virtual filesystem, no native I/O)
# Build with: cargo build --target wasm32-unknown-unknown --no-default-features --features wasm
wasm = []

# Full-text search with Tantivy (native only)
search = ["tantivy"]

# HTTP transport for module downloads
http-transport = ["reqwest"]

# Async transport support
async-transport = ["reqwest", "tokio", "futures-util", "async-trait"]

# Parallel processing with rayon (native only)
parallel = ["rayon"]

[dependencies]
# Core dependencies (always required)
thiserror.workspace = true
anyhow.workspace = true
flate2.workspace = true
regex.workspace = true
quick-xml.workspace = true
encoding_rs.workspace = true
bitflags.workspace = true
serde.workspace = true
log.workspace = true
zip.workspace = true

# Compression (cross-platform, pure Rust)
bzip2.workspace = true
xz2.workspace = true

# Native-only dependencies (feature-gated)
tantivy = { workspace = true, optional = true }
walkdir = { workspace = true, optional = true }
memmap2 = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }

# Optional dependencies
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
futures-util = { version = "0.3", optional = true }
async-trait = { version = "0.1", optional = true }
rayon = { workspace = true, optional = true }

# WASM dependencies (would be added when implementing full WASM support)
# wasm-bindgen = { version = "0.2", optional = true }
# wasm-bindgen-futures = { version = "0.4", optional = true }
# js-sys = { version = "0.3", optional = true }
# web-sys = { version = "0.3", optional = true, features = ["console", "Window"] }
# rexie = { version = "0.5", optional = true }

[dev-dependencies]
tempfile = "3.8"
